{% extends "base.html" %}
{% block titulo %}Entrar · MeshTracker Central{% endblock %}
{% block conteudo %}
<article class="cartao-estreito">
  <header>Entrar</header>
  <form method="post" action="{{ url_for('paginas.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if proximo %}<input type="hidden" name="next" value="{{ proximo }}">{% endif %}
    <label>Login
      <input name="login" autocomplete="username" required autofocus value="{{ valores.get('login', '') }}">
    </label>
    <label>Senha
      <input type="password" name="senha" autocomplete="current-password" required>
    </label>
    <button type="submit">Entrar</button>
  </form>
</article>
{% endblock %}
