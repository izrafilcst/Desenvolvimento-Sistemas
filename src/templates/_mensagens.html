{# Recusa (erro de regra), Feito (sucesso) e Aviso. A etiqueta de cada um vem do CSS (app.css). #}
{% with mensagens = get_flashed_messages(with_categories=true) %}
  {% for categoria, mensagem in mensagens %}
    <p class="mensagem mensagem-{{ categoria }}" role="{{ 'alert' if categoria == 'erro' else 'status' }}">{{ mensagem }}</p>
  {% endfor %}
{% endwith %}
{% if erro %}
  <p class="mensagem mensagem-erro" role="alert">{{ erro }}</p>
{% endif %}
